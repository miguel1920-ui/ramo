<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Ramo coreano de lirios rosados</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

svg {
    width: min(96vw, 760px);
    max-height: 98vh;
    overflow: visible;
}

/* =========================================
   MOVIMIENTO NATURAL DE LAS FLORES
========================================= */

.flower {
    transform-box: fill-box;
    transform-origin: 50% 85%;
    animation: flowerBreeze var(--duration, 6s) ease-in-out infinite;
    animation-delay: var(--flower-delay, 0s);
}

@keyframes flowerBreeze {
    0%, 100% {
        transform: rotate(-0.8deg) translateY(0);
    }

    25% {
        transform: rotate(0.5deg) translateY(-1.5px);
    }

    50% {
        transform: rotate(1.3deg) translateY(-2px);
    }

    75% {
        transform: rotate(0deg) translateY(-0.5px);
    }
}

/* MOVIMIENTO DE LAS HOJAS */

.leaves {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: leafBreeze 9s ease-in-out infinite;
}

@keyframes leafBreeze {
    0%, 100% { transform: rotate(-0.2deg); }
    50% { transform: rotate(0.6deg); }
}

/* MOVIMIENTO DEL MOÑO */

.ribbon {
    transform-box: fill-box;
    transform-origin: center;
    animation: ribbonMovement 8s ease-in-out infinite;
}

@keyframes ribbonMovement {
    0%, 100% { transform: rotate(-0.15deg); }
    50% { transform: rotate(0.35deg); }
}

/* =========================================
   ESTRELLAS DEL FONDO
========================================= */

.star {
    fill: #ffffff;
    opacity: 0.45;
    animation: twinkle 3s ease-in-out infinite;
    animation-delay: var(--star-delay, 0s);
}

.star.bright {
    opacity: 0.8;
    filter: url(#starGlow);
    animation-duration: 4s;
}

.star.small {
    opacity: 0.3;
    animation-duration: 5s;
}

@keyframes twinkle {
    0%, 100% {
        opacity: 0.2;
    }

    50% {
        opacity: 1;
    }
}

/* =========================================
   ANIMACIÓN DE CREACIÓN DEL RAMO
========================================= */

.draw-reveal {
    opacity: 0;
    clip-path: inset(100% 0 0 0);
    animation: drawAppear 1.5s ease-out forwards;
    animation-delay: var(--delay, 0s);
}

@keyframes drawAppear {
    0% {
        opacity: 0;
        clip-path: inset(100% 0 0 0);
    }

    100% {
        opacity: 1;
        clip-path: inset(0 0 0 0);
    }
}

/* DIBUJO PROGRESIVO DE LOS TALLOS */

.stem-lines path {
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    animation: drawStem 2.2s ease-out forwards;
    animation-delay: var(--delay, 0s);
}

@keyframes drawStem {
    to {
        stroke-dashoffset: 0;
    }
}

/* MOVIMIENTO REDUCIDO */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
    }

    .draw-reveal {
        opacity: 1;
        clip-path: none;
    }

    .stem-lines path {
        stroke-dashoffset: 0;
    }
}
</style>
</head>
